<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SearchDev / Compare</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body class="compare-page">

  <div class="grid-overlay"></div>

  <header class="site-header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      SearchDev/
    </div>
    <nav class="site-nav">
      <a href="index.html">Analyze</a>
      <a href="compare.html" class="nav-active">Compare</a>
      <a href="#">Trending</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-tag">Developer Comparison Tool</div>
      <h1 class="hero-title">
        Compare any two<br/>
        <span class="accent">developers</span><br/>
        side by side.
      </h1>
      <p class="hero-sub">Enter two GitHub usernames to compare their profiles, repositories, and contribution stats head to head.</p>

      <div class="compare-inputs">
        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="search-input1"
            class="search-input"
            placeholder="First username"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="compare-vs">VS</div>

        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="search-input2"
            class="search-input"
            placeholder="Second username"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <button class="search-btn" id="search-btn">
          <span>Compare</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>

      <div class="search-hint">
        Try
        <button class="hint-btn" onclick="fillCompare('torvalds','gaearon')">torvalds vs gaearon</button>
        or
        <button class="hint-btn" onclick="fillCompare('SavioRodrigues5','gaearon')">SavioRodrigues5 vs gaearon</button>
      </div>
    </section>

    <!-- Results injected here -->
    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="compare.js"></script>
  <script>
    function fillCompare(a, b) {
      document.getElementById('search-input1').value = a;
      document.getElementById('search-input2').value = b;
    }
  </script>
</body>
</html>
